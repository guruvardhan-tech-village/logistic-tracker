apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: logistic-tracker
data:
  VITE_API_BASE_URL: "https://api.logistic-tracker.example.com"
  VITE_WS_URL: "wss://api.logistic-tracker.example.com"
  VITE_ENV: "production"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: logistic-tracker
  labels:
    app: logistic-tracker
    component: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: logistic-tracker
      component: frontend
  template:
    metadata:
      labels:
        app: logistic-tracker
        component: frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/PROJECT_ID/logistic-tracker-frontend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        envFrom:
        - configMapRef:
            name: frontend-config

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: logistic-tracker
  labels:
    app: logistic-tracker
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: logistic-tracker
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: logistic-tracker
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: logistic-tracker
      component: frontend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: logistic-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
